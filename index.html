/* ---------- sessions ---------- */
function buildQueue(mode,n,ids){
  let base=ids?ids.map(i=>BY.get(i)):scopePool();
  if(mode==='weak')base=weakList();
  if(mode==='build'||mode==='listen')base=base.filter(canBuild).length>=3?base.filter(canBuild):base;
  if(mode==='type')base=base.filter(canType).length>=3?base.filter(canType):base;
  if(mode==='speak')base=base.filter(p=>p.toks.length<=14).length>=3?base.filter(p=>p.toks.length<=14):base;
  const chosen=ids?base:pick(base,n);
  return chosen.map(p=>{
    let type;
    if(mode==='daily'||mode==='weak'||ids)type=pickType(p);
    else if(mode==='flash')type='flash';
    else if(mode==='quizRE')type='mcqRE';
    else if(mode==='quizER')type='mcqER';
    else if(mode==='build')type=canBuild(p)?'build':'mcqRE';
    else if(mode==='type')type=canType(p)?'type':(canBuild(p)?'build':'mcqRE');
    else if(mode==='cloze')type='cloze';
    else if(mode==='speak')type=p.toks.length<=14?'speak':'mcqRE';
    else if(mode==='listen')type=wpick([['listenEN',2],['listenRU',1],[canBuild(p)?'listenBuild':'listenEN',2]]);
    return{id:p.id,type};
  });
}
function startSession(mode,o){
  o=o||{};
  if(mode==='match')return startMatch();
  if(mode==='blitz')return startBlitz();
  const qs=buildQueue(mode,mode==='flash'?15:(mode==='daily'?12:10),o.ids);
  if(!qs.length){toast(mode==='weak'||S.scope==='weak'?'No weak spots yet. Play a few games first.':'No phrases in this scope.');return}
  sess={mode,ids:o.ids||null,qs,i:0,right:0,wrong:0,combo:0,best:0,xp:0,missed:new Map(),rq:new Set(),locked:false,t0:Date.now(),rank0:rankInfo(ST.xp)};
  openSess();shell();nextQ();
}
function openSess(){sessEl.hidden=false;document.documentElement.style.overflow='hidden'}
function closeSess(){stopRec();clearInterval(sess&&sess.timer);try{speechSynthesis.cancel()}catch(e){}sess=null;sessEl.hidden=true;sessEl.innerHTML='';document.documentElement.style.overflow='';render()}
function shell(time){
  sessEl.innerHTML='<div class="sbar"><button class="x" data-a="quit" aria-label="Quit">'+ic('close')+'</button><div class="pbar'+(time?' time':'')+'"><i id="pf" style="width:'+(time?100:0)+'%"></i></div><span class="combo" id="cb" hidden></span></div><div class="sbody" id="sb"></div><div id="sheet" hidden></div>';
}
function setProg(){const f=$('#pf');if(f)f.style.width=Math.round(sess.i/sess.qs.length*100)+'%'}
function updCombo(){const c=$('#cb');if(!c)return;if(sess.combo>=2){c.hidden=false;c.textContent='x'+sess.combo}else c.hidden=true}
const retryType=t=>({build:'mcqRE',type:'mcqRE',cloze:'mcqRE',listenBuild:'listenEN',mcqRE:'build',mcqER:'mcqRE',listenEN:'mcqRE',listenRU:'mcqER',flash:'flash',speak:'mcqRE'})[t]||'mcqRE';
function nextQ(){
  if(sess.i>=sess.qs.length)return finish();
  const spec=sess.qs[sess.i];
  let t=spec.type;const p=BY.get(spec.id);
  if((t==='build'||t==='listenBuild')&&!canBuild(p))t='mcqRE';
  if(t==='type'&&!canType(p))t='mcqRE';
  if(t==='speak'&&p.toks.length>14)t='mcqRE';
  stopRec();
  sess.cur=makeQ({id:spec.id,type:t});sess.locked=false;sess.hinted=false;sess.pending=null;
  renderQ();
}
const lab=t=>'<div class="qlabel">'+t+'</div>';
function optsHTML(q,two){
  return '<div class="opts'+(two?' two':'')+'">'+q.opts.map((o,i)=>'<button class="opt" data-a="opt" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="'+(q.ru&&!two?'ru':'en')+'" style="'+(q.ru&&!two?'color:var(--ink)':'')+'">'+esc(o.text)+'</span></button>').join('')+'</div>';
}
function listenHTML(slow){return '<div class="listen"><button class="play" data-a="speak" data-id="'+sess.cur.id+'" aria-label="Play">'+ic('spk')+'</button><button class="slowb" data-a="slow">Slow</button></div>'}
function buildHTML(){return '<div class="slot" id="slot"></div><div class="bank" id="bank"></div><div class="row"><button class="btn ghost" data-a="reset">Reset</button><button class="btn primary" id="chk" data-a="check" disabled>Check</button></div>'}
function paintBuild(){
  const q=sess.cur,used=new Set(q.ans);
  $('#slot').innerHTML=q.ans.map((id,k)=>'<button class="chipw'+(q.mark?(q.mark[k]?' good':' bad'):'')+'" data-a="unchip" data-k="'+k+'">'+esc(q.items.find(x=>x.id===id).t)+'</button>').join('');
  $('#bank').innerHTML=q.items.map(x=>'<button class="chipw'+(used.has(x.id)?' ghost':'')+'" data-a="chip" data-id="'+x.id+'">'+esc(x.t)+'</button>').join('');
  const need=BY.get(q.id).toks.length;$('#chk').disabled=q.ans.length!==need||sess.locked;
}
function renderQ(){
  const q=sess.cur,p=BY.get(q.id),sb=$('#sb');hideSheet();
  const prompt=strip(p,{prompt:true}).replace(/<div class="en[^>]*>.*?<\/div>/,'');
  const promptEN='<div class="strip prompt"><div class="tag"><b>'+ROMAN[p.s]+'</b><span>#'+p.id+'</span></div><div class="txt"><div class="en">'+esc(p.core)+'</div></div><span></span></div>';
  let h='';
  switch(q.t){
    case 'mcqRE':h=lab('Translate into English')+prompt+optsHTML(q);break;
    case 'mcqER':h=lab('What does it mean?')+promptEN+optsHTML(q);break;
    case 'listenEN':h=lab('Listen, then pick what you heard')+listenHTML()+optsHTML(q);break;
    case 'listenRU':h=lab('Listen, then pick the meaning')+listenHTML()+optsHTML(q);break;
    case 'build':h=lab('Build the phrase in English')+prompt+buildHTML();break;
    case 'listenBuild':h=lab('Listen and build what you hear')+listenHTML()+'<div id="ruhint"><button class="btn ghost sm" data-a="ruhint">Show Russian (half XP)</button></div>'+buildHTML();break;
    case 'type':h=lab('Write the phrase in English')+prompt+'<textarea id="ti" class="ti" rows="3" placeholder="Type the English phrase" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea><div id="hl" class="hintline"></div><div class="row"><button class="btn ghost" data-a="hint">Hint</button><button class="btn primary" data-a="check">Check</button></div>';break;
    case 'speak':h=lab('Say it in English')+prompt+'<div class="micwrap"><button class="mic" id="mic" data-a="mic" aria-label="Tap to speak">'+ic('mic')+'</button><div class="hintline" id="mstat">'+(voiceOK()?'Tap the microphone and say the phrase':'Voice input is not available here. Type it, or use the microphone key on your keyboard.')+'</div></div><div class="heard you" id="heard"></div><div id="hl" class="hintline" style="text-align:center"></div><div id="typebox"></div><div class="row"><button class="btn ghost" data-a="hint">Hint</button><button class="btn ghost" data-a="micType">Type instead</button></div>';break;
    case 'cloze':h=lab('Fill the gap')+prompt+'<div class="cloze">'+esc(q.before)+' <span class="gap" id="gp">&nbsp;</span>'+esc(q.after)+'</div>'+optsHTML(q,true);break;
    case 'flash':h=flashHTML(q,p,false);break;
  }
  sb.innerHTML=h;sb.scrollTop=0;setProg();
  if(q.items)paintBuild();
  if(q.t.indexOf('listen')===0&&LISTEN)setTimeout(()=>{if(sess&&!sess.locked)speak(p.core)},350);
  if(q.t==='type')setTimeout(()=>{const t=$('#ti');if(t)t.focus()},80);
  if(q.t==='speak'&&!voiceOK())showTypeBox();
}
function flashHTML(q,p,flipped){
  const d=ST.set.dir,front=d==='ru-en'?'<div class="ru" style="color:var(--ink);font-size:18px">'+esc(p.ru)+'</div>':'<div class="en" style="font-size:16.5px">'+esc(p.en)+'</div>';
  const back=d==='ru-en'?'<div class="en" style="font-size:16.5px">'+esc(p.en)+'</div>':'<div class="ru" style="color:var(--ink);font-size:18px">'+esc(p.ru)+'</div>';
  const seg='<div class="segc dirsw"><button data-a="dir" data-v="ru-en" aria-pressed="'+(d==='ru-en')+'">RU → EN</button><button data-a="dir" data-v="en-ru" aria-pressed="'+(d==='en-ru')+'">EN → RU</button></div>';
  return seg+'<div class="fc"><div class="strip prompt"><div class="tag"><b>'+ROMAN[p.s]+'</b><span>#'+p.id+'</span></div><div class="txt">'+front+(flipped?'<hr class="sep">'+'<div class="ans">'+back+'</div>':'')+'</div>'+(LISTEN&&(flipped||d==='en-ru')?'<button class="spk" data-a="speak" data-id="'+p.id+'" aria-label="Play">'+ic('spk')+'</button>':'<span></span>')+'</div>'
   +(flipped?'<div class="row"><button class="btn bad" data-a="fAgain">Again</button><button class="btn good" data-a="fGot">Got it</button></div>':'<button class="btn primary wide" data-a="flip">Show answer</button>')+'</div>';
}
function hideSheet(){const s=$('#sheet');if(s){s.hidden=true;s.innerHTML=''}}
const PRAISE=['Roger','Affirm','Copy that','Good read-back','Solid','Well flown'];
function showSheet(ok,p,gain,extra){
  const s=$('#sheet');s.hidden=false;
  s.innerHTML='<div class="sheet '+(ok?'good':'bad')+'" role="status"><div class="sheet-in"><div class="sh-head"><span>'+(ok?PRAISE[rnd(PRAISE.length)]:'Say again')+'</span>'+(ok&&gain?'<span class="xp">+'+gain+' XP</span>':'')+'</div>'
   +(extra&&extra.you?'<div class="you">'+extra.you+'</div>':'')
   +'<div class="sh-ans"><div class="en">'+esc(p.en)+'</div><div class="ru">'+esc(p.ru)+'</div></div>'
   +'<div class="sh-actions">'+(LISTEN?'<button class="btn spkb" data-a="speak" data-id="'+p.id+'" aria-label="Play">'+ic('spk')+'</button>':'')
   +(extra&&extra.override?'<button class="btn ghost" data-a="override">Count as correct</button>':'')
   +'<button class="btn '+(ok?'good':'bad')+'" data-a="next" id="nx">Continue</button></div></div></div>';
  const sb=$('#sb');if(sb)setTimeout(()=>{sb.scrollTop=sb.scrollHeight},30);
}
function finalize(ok,o){
  o=o||{};const p=BY.get(sess.cur.id);grade(p.id,ok,o.hinted);let gain=0;
  if(ok){sess.right++;sess.combo++;sess.best=Math.max(sess.best,sess.combo);gain=o.xp!=null?o.xp:(o.hinted?5:10+Math.min(sess.combo-1,5));addXP(gain);sfx('ok')}
  else{sess.wrong++;sess.combo=0;sess.missed.set(p.id,p);if(!sess.rq.has(p.id)){sess.rq.add(p.id);sess.qs.push({id:p.id,type:retryType(sess.cur.t)})}sfx('bad')}
  updCombo();save();return gain;
}
function conclude(ok,extra){
  if(sess.locked)return;sess.locked=true;
  const p=BY.get(sess.cur.id);
  if(!ok&&extra&&extra.override){sess.pending={hinted:sess.hinted};showSheet(false,p,0,extra);return}
  const gain=finalize(ok,{hinted:sess.hinted});showSheet(ok,p,gain,extra);
}

/* ---------- finish ---------- */
function finish(){
  clearInterval(sess.timer);stopRec();
  ST.sessions++;
  const total=sess.right+sess.wrong,acc=total?sess.right/total:0;
  let bonus=0;
  if(sess.mode!=='blitz'&&total>=5&&acc>=.8){bonus=20;addXP(bonus)}
  if(sess.mode==='blitz'&&sess.right>ST.best.blitz){ST.best.blitz=sess.right;sess.newBest=true}
  ST.bestStreak=Math.max(ST.bestStreak,streak());save();
  const after=rankInfo(ST.xp);sess.rankUp=after.i>sess.rank0.i?after:null;sess.bonus=bonus;
  sfx('done');renderResult();
}
function renderResult(){
  const total=sess.right+sess.wrong,acc=total?Math.round(sess.right/total*100):0,secs=Math.round((Date.now()-sess.t0)/1000);
  const C=2*Math.PI*44,off=C*(1-acc/100),miss=[...sess.missed.values()];
  const blitz=sess.mode==='blitz';
  sessEl.innerHTML='<div class="sbody"><div class="res">'
   +'<div class="ring" style="width:112px;height:112px"><svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="44" fill="none" stroke="var(--line)" stroke-width="11"/><circle cx="56" cy="56" r="44" fill="none" stroke="'+(acc>=80?'var(--good)':'var(--signal)')+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg><div class="num" style="font-size:28px">'+(blitz?sess.right:acc+'%')+'</div></div>'
   +'<h2>'+(blitz?(sess.newBest?'New best':'Time'):'Sortie complete')+'</h2>'
   +(sess.rankUp?'<div class="banner">Promoted to '+esc(sess.rankUp.name)+'</div>':'')
   +'<div class="stats"><div class="card stat"><b>'+sess.right+' / '+total+'</b><span>correct</span></div><div class="card stat"><b>+'+sess.xp+'</b><span>XP'+(sess.bonus?' (incl. +'+sess.bonus+' bonus)':'')+'</span></div><div class="card stat"><b>x'+sess.best+'</b><span>best combo</span></div><div class="card stat"><b>'+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')+'</b><span>time</span></div></div>'
   +(miss.length?'<div class="kicker" style="align-self:start">Review these</div><div class="list">'+miss.map(p=>strip(p,{speak:true})).join('')+'</div>':'')
   +'<div class="row" style="width:100%">'+(miss.length?'<button class="btn ghost" data-a="drill">Drill misses</button>':'')+'<button class="btn ghost" data-a="again">Fly again</button></div>'
   +'<button class="btn primary wide" data-a="home">Back to base</button></div></div>';
}

/* ---------- match ---------- */
function startMatch(){
  let base=scopePool().filter(canMatch);if(base.length<5)base=P.filter(canMatch);
  const ids=pick(base,15).map(p=>p.id);
  sess={mode:'match',qs:ids.map(id=>({id,type:'match'})),i:0,right:0,wrong:0,combo:0,best:0,xp:0,missed:new Map(),rq:new Set(),t0:Date.now(),rank0:rankInfo(ST.xp),ids,board:0};
  openSess();shell();matchBoard();
}
function matchBoard(){
  const ids=sess.ids.slice(sess.board*5,sess.board*5+5);
  if(!ids.length)return finish();
  sess.m={ids,sel:null,done:new Set(),miss:new Set(),graded:new Set()};
  const L=shuffle(ids),R=shuffle(ids);
  $('#sb').innerHTML=lab('Match each English phrase with its Russian meaning · board '+(sess.board+1)+' of 3')
   +'<div class="mgrid"><div class="mcol">'+L.map(id=>'<button class="mt en" data-a="mpick" data-side="e" data-id="'+id+'">'+esc(BY.get(id).core)+'</button>').join('')+'</div><div class="mcol">'+R.map(id=>'<button class="mt" data-a="mpick" data-side="r" data-id="'+id+'">'+esc(BY.get(id).ru)+'</button>').join('')+'</div></div>';
  const f=$('#pf');if(f)f.style.width=Math.round(sess.board/3*100)+'%';
}
function mTap(btn){
  const m=sess.m,side=btn.dataset.side,id=+btn.dataset.id;
  if(m.done.has(id)||sess.mlock)return;
  document.querySelectorAll('.mt.sel').forEach(b=>{if(b.dataset.side===side)b.classList.remove('sel')});
  if(!m.sel||m.sel.side===side){m.sel={side,id,btn};btn.classList.add('sel');return}
  const a=m.sel;m.sel=null;
  if(a.id===id){
    document.querySelectorAll('.mt[data-id="'+id+'"]').forEach(b=>{b.classList.remove('sel');b.classList.add('done')});m.done.add(id);sfx('ok');
    if(!m.miss.has(id)&&!m.graded.has(id)){m.graded.add(id);grade(id,true,false);sess.right++;addXP(6)}
    if(m.done.size===5){sess.mlock=true;setTimeout(()=>{sess.mlock=false;sess.board++;save();matchBoard()},650)}
  }else{
    [a.btn,btn].forEach(b=>b.classList.add('shake'));sfx('bad');
    setTimeout(()=>{document.querySelectorAll('.mt.shake,.mt.sel').forEach(b=>b.classList.remove('shake','sel'))},320);
    [a.id,id].forEach(x=>{if(!m.miss.has(x)){m.miss.add(x);m.graded.add(x);grade(x,false,false);sess.wrong++;sess.missed.set(x,BY.get(x))}});
  }
  save();
}

/* ---------- blitz ---------- */
function startBlitz(){
  let base=scopePool().filter(p=>p.core.length<=70);if(base.length<8)base=P.filter(p=>p.core.length<=70);
  const order=[];for(let k=0;k<6;k++)order.push(...shuffle(base));
  sess={mode:'blitz',qs:order.map(p=>({id:p.id,type:Math.random()<.6?'mcqRE':'mcqER'})),i:0,right:0,wrong:0,combo:0,best:0,xp:0,missed:new Map(),rq:new Set(),t0:Date.now(),rank0:rankInfo(ST.xp),tEnd:Date.now()+60000};
  openSess();shell(true);
  sess.timer=setInterval(()=>{const left=sess.tEnd-Date.now();const f=$('#pf');if(f)f.style.width=Math.max(0,left/600)+'%';if(left<=0){clearInterval(sess.timer);finish()}},100);
  blitzQ();
}
function blitzQ(){
  const spec=sess.qs[sess.i];sess.cur=makeQ(spec);sess.locked=false;const q=sess.cur,p=BY.get(q.id);
  const prompt=q.t==='mcqRE'?strip(p,{prompt:true}).replace(/<div class="en[^>]*>.*?<\/div>/,''):'<div class="strip prompt"><div class="tag"><b>'+ROMAN[p.s]+'</b><span>#'+p.id+'</span></div><div class="txt"><div class="en">'+esc(p.core)+'</div></div><span></span></div>';
  $('#sb').innerHTML=lab((q.t==='mcqRE'?'Translate into English':'What does it mean?')+' · score '+sess.right)+prompt+optsHTML(q);
}
function blitzPick(i){
  if(sess.locked)return;sess.locked=true;
  const q=sess.cur,ok=!!q.opts[i].ok;
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('good');else if(j===i)b.classList.add('bad');else b.classList.add('dim')});
  grade(q.id,ok,false);
  if(ok){sess.right++;sess.combo++;sess.best=Math.max(sess.best,sess.combo);addXP(5);sfx('ok')}else{sess.wrong++;sess.combo=0;sess.missed.set(q.id,BY.get(q.id));sfx('bad')}
  updCombo();save();
  const me=sess;
  setTimeout(()=>{if(sess!==me||me.mode!=='blitz'||me.tEnd-Date.now()<=0)return;me.i++;blitzQ()},ok?260:900);
}

/* ---------- actions ---------- */
function typedCheck(inp,p){
  const u=norm(inp).split(' ').filter(Boolean);
  const KEY=new Set(['left','right','climb','descend','not','no','negative','unable','reduce','increase']);
  const eq=(a,b)=>{if(a.length!==b.length)return false;for(let i=0;i<a.length;i++){if(a[i]===b[i])continue;if(/\d/.test(a[i]+b[i])||KEY.has(a[i])||KEY.has(b[i]))return false;if(a[i].length>=5&&lev(a[i],b[i])<=1)continue;return false}return true};
  for(const c of [p.core,p.en.replace(/[()]/g,' ')]){const t=norm(c).split(' ').filter(Boolean);if(eq(u,t))return{ok:true}}
  const t=norm(p.core).split(' ').filter(Boolean),keep=lcs(u,t);
  return{ok:false,you:u.map((w,i)=>keep[i]?'<span class="ok">'+esc(w)+'</span>':'<s>'+esc(w)+'</s>').join(' ')};
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let pr=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cu=[i];for(let j=1;j<=n;j++)cu[j]=Math.min(pr[j]+1,cu[j-1]+1,pr[j-1]+(a[i-1]===b[j-1]?0:1));pr=cu}return pr[n]}
function lcs(u,t){const m=u.length,n=t.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=u[i]===t[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);const k=Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(u[i]===t[j]){k[i]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return k}

let REC=null;
function stopRec(){if(REC){if(REC.nstop){try{REC.nstop()}catch(e){}}try{REC.onend=null;REC.onerror=null;REC.onresult=null;REC.abort()}catch(e){}REC=null}}
function setMic(on,msg){const m=$('#mic'),s=$('#mstat');if(m)m.classList.toggle('live',on);if(s&&msg)s.textContent=msg}
function showTypeBox(){
  const b=$('#typebox');if(!b||b.innerHTML)return;
  b.innerHTML='<textarea id="ti" class="ti" rows="3" placeholder="Type the English phrase" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea><div class="row"><button class="btn primary" data-a="check">Check</button></div>';
}
function judgeSpeech(alts){
  const p=BY.get(sess.cur.id);
  const rs=alts.map(a=>speechEval(a,p)).sort((a,b)=>(b.ok-a.ok)||(b.cov-a.cov));
  const r=rs[0];conclude(r.ok,r.ok?{you:r.you}:{you:r.you,override:true});
}
async function nativeListen(N){
  const me=sess,qcur=sess.cur;
  try{
    const av=await N.available();
    if(!av||!av.available){setMic(false,'Speech recognition is not installed on this phone. Use Type instead.');showTypeBox();return}
    let perm=await N.checkPermissions();
    if(!perm||perm.speechRecognition!=='granted')perm=await N.requestPermissions();
    if(!perm||perm.speechRecognition!=='granted'){setMic(false,'Microphone permission denied. Allow it in Android Settings > Apps > Radio Check > Permissions, or use Type instead.');showTypeBox();return}
    $('#heard').textContent='';setMic(true,'Listening… say the phrase, then pause');
    REC={nstop:()=>N.stop()};
    const r=await N.start({language:'en-US',maxResults:3,prompt:'',partialResults:false,popup:false});
    REC=null;setMic(false,'');
    if(sess!==me||me.locked||sess.cur!==qcur)return;
    const alts=(r&&r.matches)||[];
    if(alts.length)judgeSpeech(alts);else setMic(false,'Nothing heard. Tap the microphone and try again.');
  }catch(e){
    REC=null;const m=String((e&&e.message)||e||'');
    if(/match|timeout|no speech|speech/i.test(m)&&!/permission|denied|not.?allowed/i.test(m))setMic(false,'Nothing heard. Tap the microphone and try again.');
    else{setMic(false,'Could not listen ('+m.slice(0,60)+'). Try again or use Type instead.');showTypeBox()}
  }
}
function micToggle(){
  if(!sess||sess.locked)return;
  const N=nsr();
  if(N){if(REC){stopRec();setMic(false,'');return}nativeListen(N);return}
  if(!SR){toast('Voice input is not available here. Use Type instead.');showTypeBox();return}
  if(REC){try{REC.stop()}catch(e){}return}
  try{speechSynthesis.cancel()}catch(e){}
  const r=new SR();REC=r;r.lang='en-US';r.interimResults=true;r.maxAlternatives=3;r.continuous=false;
  const me=sess;let finalAlts=null;
  $('#heard').textContent='';setMic(true,'Listening… say the phrase, then pause');
  r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal){finalAlts=[];for(let k=0;k<res.length;k++)finalAlts.push(res[k].transcript)}else interim+=res[0].transcript}if(interim&&$('#heard'))$('#heard').textContent=interim};
  r.onerror=e=>{
    REC=null;
    const msg={'not-allowed':'The microphone is blocked. Allow it in the browser, or use Type instead.','service-not-allowed':'Voice recognition is blocked on this device. Use Type instead.','audio-capture':'No microphone found. Use Type instead.','network':'Voice recognition needs an internet connection.','no-speech':'Nothing heard. Tap the microphone and try again.','aborted':''}[e.error];
    setMic(false,msg===undefined?'Could not listen ('+e.error+'). Try again or use Type instead.':msg);
    if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture')showTypeBox();
  };
  r.onend=()=>{REC=null;setMic(false);if(sess!==me||me.locked)return;if(finalAlts){setMic(false,'');judgeSpeech(finalAlts)}else if($('#mstat')&&/Listening/.test($('#mstat').textContent))setMic(false,'Nothing heard. Tap the microphone and try again.')};
  try{r.start()}catch(err){REC=null;setMic(false,'Could not start the microphone. Use Type instead.');showTypeBox()}
}
const A={
  tab(el){S.tab=el.dataset.v;render();window.scrollTo(0,0)},
  scope(el){const v=el.dataset.v;S.scope=(v==='all'||v==='weak')?v:+v;if(S.scope==='weak'&&!weakList().length)toast('No weak spots yet. They appear after misses.');render()},
  bu(el){const v=el.dataset.v;S.bu=v==='all'?'all':+v;render();const q=$('#q');if(q&&S.q){}},
  cover(el){S.cover=el.dataset.v;render()},
  uncover(el){el.classList.toggle('cov')},
  daily(){startSession('daily')},
  mode(el){startSession(el.dataset.v)},
  speak(el){speak(BY.get(+el.dataset.id).core)},
  slow(){speak(BY.get(sess.cur.id).core,true)},
  opt(el){
    const i=+el.dataset.i;
    if(sess.mode==='blitz')return blitzPick(i);
    if(sess.locked)return;
    const q=sess.cur,p=BY.get(q.id),ok=!!q.opts[i].ok;
    document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('good');else if(j===i)b.classList.add('bad');else b.classList.add('dim')});
    if(q.t==='cloze'){const g=$('#gp');g.textContent=q.correct;g.classList.add(ok?'good':'bad')}
    conclude(ok);
  },
  chip(el){const q=sess.cur;if(sess.locked)return;const id=+el.dataset.id;if(q.ans.includes(id))return;q.ans.push(id);q.mark=null;paintBuild()},
  unchip(el){if(sess.locked)return;sess.cur.ans.splice(+el.dataset.k,1);sess.cur.mark=null;paintBuild()},
  reset(){if(sess.locked)return;sess.cur.ans=[];sess.cur.mark=null;paintBuild()},
  ruhint(){sess.hinted=true;const p=BY.get(sess.cur.id);$('#ruhint').innerHTML='<div class="ru" style="color:var(--ink)">'+esc(p.ru)+'</div>'},
  hint(){
    if(sess.locked)return;sess.hinted=true;const p=BY.get(sess.cur.id);
    $('#hl').textContent=p.toks.map(w=>w[0]+'_'.repeat(Math.max(0,Math.min(w.length-1,8)))).join(' ');
  },
  check(){
    if(sess.locked)return;const q=sess.cur,p=BY.get(q.id);
    if(q.items){
      const ok=q.ans.length===p.toks.length&&q.ans.every((id,k)=>normTok(q.items.find(x=>x.id===id).t)===normTok(p.toks[k]));
      q.mark=q.ans.map((id,k)=>normTok(q.items.find(x=>x.id===id).t)===normTok(p.toks[k]));
      sess.locked=true;paintBuild();sess.locked=false;conclude(ok);
    }else{
      const ti=$('#ti');if(!ti||!ti.value.trim()){toast('Type your answer first');return}
      ti.blur();const r=typedCheck(ti.value,p);ti.readOnly=true;
      conclude(r.ok,r.ok?null:{you:r.you,override:true});
    }
  },
  mic(){micToggle()},
  micType(){stopRec();setMic(false);showTypeBox();const t=$('#ti');if(t)t.focus()},
  override(){
    if(!sess.pending)return;const h=sess.pending.hinted;sess.pending=null;
    const p=BY.get(sess.cur.id);const gain=finalize(true,{hinted:h});showSheet(true,p,gain);
  },
  next(){
    if(!sess)return;
    if(sess.pending){const h=sess.pending.hinted;sess.pending=null;finalize(false,{hinted:h})}
    sess.i++;nextQ();
  },
  flip(){const q=sess.cur,p=BY.get(q.id);$('#sb').innerHTML=flashHTML(q,p,true);if(ST.set.auto)speak(p.core)},
  dir(el){ST.set.dir=el.dataset.v;save();const q=sess.cur,p=BY.get(q.id);const flipped=!!$('.fc .ans');$('#sb').innerHTML=flashHTML(q,p,flipped)},
  fGot(){finalize(true,{xp:5});sess.i++;nextQ()},
  fAgain(){finalize(false);sess.i++;nextQ()},
  mpick(el){mTap(el)},
  quit(){
    if(!sess)return;
    if(sess.i===0&&sess.right+sess.wrong===0)return closeSess();
    dialog('End this sortie?','Progress so far is saved.','End sortie',()=>closeSess(),'Keep going');
  },
  again(){const m=sess.mode,ids=sess.ids;clearInterval(sess.timer);sess=null;startSession(m,m==='match'||m==='blitz'?{}:{ids:ids&&m!=='flash'?ids:null})},
  drill(){const ids=[...sess.missed.keys()];clearInterval(sess.timer);sess=null;startSession('daily',{ids})},
  home(){closeSess()},
  set(el){
    const k=el.dataset.k;let v=el.dataset.v;
    if(k==='goal')v=+v;else if(k==='rate')v=+v;else if(k==='sfx'||k==='auto')v=(v==='true');
    ST.set[k]=v;save();if(k==='theme')applyTheme();const y=window.scrollY;render();window.scrollTo(0,y);
  },
  bkShow(){const ta=$('#bk');ta.value=JSON.stringify(ST);ta.focus();ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied'),()=>toast('Select the text and copy it'))}catch(e){toast('Select the text and copy it')}},
  bkRestore(){try{const o=JSON.parse($('#bk').value);if(!o||typeof o.xp!=='number'||typeof o.cards!=='object')throw 0;ST=Object.assign(defaults(),o);ST.set=Object.assign(defaults().set,o.set||{});ST.best=Object.assign({blitz:0},o.best||{});save();applyTheme();render();toast('Progress restored')}catch(e){toast('That code is not valid')}},
  resetAsk(){dialog('Reset all progress?','XP, streak and every phrase level will be erased. This cannot be undone.','Reset',()=>{ST=defaults();save();applyTheme();render();toast('Progress reset')})}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f)f(t,e)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const l=$('#booklist');if(l)l.innerHTML=bookList()}});
document.addEventListener('keydown',e=>{
  if(!sess||sessEl.hidden)return;
  const ti=e.target&&e.target.id==='ti';
  if(ti&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();A.check();return}
  if(ti)return;
  const nx=$('#nx');
  if((e.key==='Enter'||e.key===' ')&&nx&&!$('#sheet').hidden){e.preventDefault();A.next();return}
  if(/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click()}
});
render();
})();
</script>

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
