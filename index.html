<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B4F8A">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Radio Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a phone trainer styled after the cockpit/tower desk. Chart-paper ground,
   every phrase shown as a ruled ATC flight strip with mono text. The strip carries the
   personality; everything around it stays quiet. */
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --surface2:#F1F4F7; --ink:#0D1B2A; --muted:#556677; --line:#CFD8E0;
  --primary:#1B4F8A; --primary-d:#12365F; --on-primary:#FFFFFF;
  --signal:#F2A000; --on-signal:#1A1200;
  --good:#1B8657; --good-d:#126140; --good-bg:#DCF2E6;
  --bad:#C23A2E; --bad-d:#8F2A21; --bad-bg:#FBE2DF;
  --shadow:0 1px 0 rgba(13,27,42,.05),0 8px 20px -14px rgba(13,27,42,.35);
  --f-disp:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09131C; --surface:#10202E; --surface2:#162A3B; --ink:#E6EEF5; --muted:#8FA3B5; --line:#243A4D;
    --primary:#5AA2EE; --primary-d:#2F6DB0; --on-primary:#04111D;
    --signal:#FFB41F; --on-signal:#1A1200;
    --good:#3BC987; --good-d:#238A5C; --good-bg:#11372A;
    --bad:#FF7468; --bad-d:#B24A41; --bad-bg:#431F1A;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09131C; --surface:#10202E; --surface2:#162A3B; --ink:#E6EEF5; --muted:#8FA3B5; --line:#243A4D;
  --primary:#5AA2EE; --primary-d:#2F6DB0; --on-primary:#04111D;
  --signal:#FFB41F; --on-signal:#1A1200;
  --good:#3BC987; --good-d:#238A5C; --good-bg:#11372A;
  --bad:#FF7468; --bad-d:#B24A41; --bad-bg:#431F1A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);margin:0;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h2{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 110px}
.h2{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.kicker{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font:700 21px/1 var(--f-disp);letter-spacing:.07em;text-transform:uppercase}
.brand svg{width:24px;height:24px;color:var(--primary)}
.rankchip{font:600 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:6px 9px;border:1px solid var(--line);border-radius:3px;background:var(--surface);white-space:nowrap}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center;box-shadow:var(--shadow)}
.ring{position:relative;width:88px;height:88px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:700 22px var(--f-disp)}
.big{font:700 34px/1.05 var(--f-disp);font-variant-numeric:tabular-nums}
.big small{font:500 14px var(--f-mono);color:var(--muted)}
.streak{display:flex;align-items:center;gap:6px;margin-top:4px;color:var(--muted);font-weight:500;font-size:14px}
.streak svg{width:18px;height:18px;color:var(--signal)}
.hero .btn{grid-column:1/-1;margin-top:12px}
.duerow{grid-column:1/-1;display:flex;gap:16px;font:500 13px var(--f-mono);color:var(--muted);padding-top:10px}
.duerow b{color:var(--ink);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:10px;font-weight:600;font-size:16px;min-height:50px;transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 3px 0 var(--primary-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--primary-d)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 3px 0 var(--good-d)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 3px 0 var(--bad-d)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1}

/* chips & units */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font:600 13px var(--f-mono)}
.chip[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.units{display:grid;gap:8px}
.unit{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;width:100%;padding:11px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px}
.unit[aria-pressed=true]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.roman{font:700 18px var(--f-disp);display:grid;place-items:center;height:44px;border:1px solid var(--line);border-radius:3px;background:var(--surface2)}
.uname{font-weight:600;line-height:1.25}
.umeta{font:500 12px var(--f-mono);color:var(--muted);margin-top:2px}
.seg{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:7px}
.seg i{display:block;height:100%}
.seg .m{background:var(--good)}.seg .l{background:var(--signal)}

/* strip */
.strip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;border:1px solid var(--line);border-radius:3px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.strip .tag{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;padding:8px 8px;min-width:54px;border-right:1px dashed var(--line);background:var(--surface2);font:600 11px/1.1 var(--f-mono);color:var(--muted)}
.strip .tag b{font:700 19px/1 var(--f-disp);color:var(--ink)}
.strip .txt{padding:10px 14px;min-width:0;display:grid;gap:4px}
.en{font-family:var(--f-mono);font-weight:500;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.ru{font-size:15px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.spk{width:48px;display:grid;place-items:center;color:var(--primary);border-left:1px dashed var(--line)}
.spk svg{width:22px;height:22px}
.list{display:grid;gap:10px}
.cov{filter:blur(7px);cursor:pointer;user-select:none}
.pips{display:flex;gap:3px;margin-top:2px}
.pips i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--signal)}.pips i.m{background:var(--good)}
.prompt .txt{padding:14px 16px}
.prompt .ru{color:var(--ink);font-size:18px;line-height:1.4}
.prompt .en{font-size:16.5px}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;min-height:118px;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile svg{width:26px;height:26px;color:var(--primary)}
.tile b{font:700 19px/1.1 var(--f-disp);margin-top:4px}
.tile span{font-size:13px;color:var(--muted);line-height:1.3}
.tile[disabled]{opacity:.5;pointer-events:none}
.scopeline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:2px 0 8px;font-size:14px;color:var(--muted)}
.scopeline b{color:var(--ink)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.tabs>div{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font:600 10.5px var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.tab svg{width:24px;height:24px}
.tab[aria-current=page]{color:var(--primary)}

/* phrasebook */
.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:16px var(--f-body)}
.segc{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.segc button{flex:1;padding:9px 6px;text-align:center;font:600 12.5px var(--f-mono);color:var(--muted);border-right:1px solid var(--line)}
.segc button:last-child{border-right:0}
.segc button[aria-pressed=true]{background:var(--primary);color:var(--on-primary)}
.tools{display:grid;gap:10px;margin-bottom:12px}

/* progress */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat b{display:block;font:700 28px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.stat span{font:500 12px var(--f-mono);color:var(--muted)}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.xpbar i{display:block;height:100%;background:var(--signal)}
.week{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.week i{display:block;width:100%;background:var(--primary);border-radius:3px 3px 0 0;min-height:3px}
.week i.today{background:var(--signal)}
.week span{font:500 10.5px var(--f-mono);color:var(--muted)}
.setrow{display:grid;gap:6px;margin-top:14px}
.setrow label{font-weight:600;font-size:14px}
textarea.bk{width:100%;min-height:76px;margin-top:8px;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:12px/1.4 var(--f-mono);resize:vertical}

/* session */
.sess{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sbar{display:flex;align-items:center;gap:12px;padding:12px 16px 6px;max-width:560px;width:100%;margin:0 auto}
.x{width:36px;height:36px;display:grid;place-items:center;color:var(--muted);flex:none}
.x svg{width:24px;height:24px}
.pbar{flex:1;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--primary);border-radius:6px;transition:width .3s}
.pbar.time i{background:var(--signal);transition:width .1s linear}
.combo{font:700 13px var(--f-mono);background:var(--signal);color:var(--on-signal);padding:3px 9px;border-radius:999px;flex:none}
.sbody{flex:1;overflow:auto;padding:8px 16px 24px;max-width:560px;width:100%;margin:0 auto}
.qlabel{font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;padding:13px 14px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:10px;background:var(--surface);min-height:54px}
.opt .n{font:600 12px var(--f-mono);color:var(--muted);padding-top:3px}
.opts.two .opt{grid-template-columns:1fr;justify-items:center;align-items:center;text-align:center;min-height:58px}
.opts.two .opt .n{display:none}
.opts.two .opt .en{font-size:17px;font-weight:600}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.sheet{padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid;animation:up .2s ease-out}
.sheet.good{background:var(--good-bg);border-color:var(--good)}
.sheet.bad{background:var(--bad-bg);border-color:var(--bad)}
.sheet-in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;font:700 22px var(--f-disp)}
.sheet.good .sh-head{color:var(--good)}.sheet.bad .sh-head{color:var(--bad)}
.sh-head .xp{font:600 13px var(--f-mono)}
.sh-ans{display:grid;gap:3px}
.sh-actions{display:flex;gap:10px;margin-top:6px}
.sh-actions .btn{flex:1}
.sh-actions .spkb{flex:none;width:50px;padding:0}
.sh-actions svg{width:22px;height:22px}
.sh-actions .spkb{background:var(--surface);border:1.5px solid var(--line);color:var(--primary)}
.you{font:500 14px/1.6 var(--f-mono)}
.you s{color:var(--bad);text-decoration-thickness:2px}
.you .ok{color:var(--good)}
.listen{display:flex;align-items:center;gap:12px;margin:6px 0}
.play{width:84px;height:84px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 4px 0 var(--primary-d);flex:none}
.play:active{transform:translateY(2px)}
.play svg{width:38px;height:38px}
.slowb{padding:10px 14px;border:1.5px solid var(--line);border-radius:999px;font:600 13px var(--f-mono);background:var(--surface)}
.slot{min-height:96px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:12px;border:1.5px dashed var(--line);border-radius:8px;background:var(--surface);margin-top:14px}
.chipw{padding:9px 12px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:8px;background:var(--surface);font:500 15px var(--f-mono)}
.slot .chipw{background:var(--surface2)}
.chipw.good{border-color:var(--good);background:var(--good-bg)}
.chipw.bad{border-color:var(--bad);background:var(--bad-bg)}
.chipw.ghost{opacity:.18;pointer-events:none}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hintline{font:500 13px var(--f-mono);color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
textarea.ti{display:block;width:100%;min-height:100px;margin-top:14px;padding:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:500 16px/1.5 var(--f-mono);resize:none}
.cloze{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font:500 16.5px/1.9 var(--f-mono)}
.gap{display:inline-block;min-width:4.5ch;text-align:center;border-bottom:3px solid var(--primary);color:var(--primary);padding:0 4px}
.gap.good{color:var(--good);border-color:var(--good)}.gap.bad{color:var(--bad);border-color:var(--bad)}
.micwrap{display:grid;justify-items:center;gap:10px;margin:22px 0 8px;text-align:center}
.mic{width:96px;height:96px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 4px 0 var(--primary-d)}
.mic svg{width:40px;height:40px}
.mic.live{background:var(--bad);box-shadow:0 4px 0 var(--bad-d);animation:pulse 1.2s infinite}
@keyframes pulse{0%{outline:0 solid rgba(194,58,46,.45)}100%{outline:22px solid rgba(194,58,46,0)}}
.mic.live{outline:0 solid rgba(194,58,46,.45)}
.heard{min-height:28px;text-align:center}
.fc{margin-top:10px;display:grid;gap:12px}
.fc .ans{animation:fade .25s ease-out}
.fc .sep{border:0;border-top:1px dashed var(--line);margin:2px 0}
.dirsw{margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.mcol{display:grid;gap:10px;align-content:start}
.mt{padding:11px 10px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:8px;background:var(--surface);min-height:64px;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.mt.en{font-size:12.5px}
.mt.sel{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.mt.done{border-color:var(--good);background:var(--good-bg);pointer-events:none}
.mt.shake{animation:shake .3s;border-color:var(--bad);background:var(--bad-bg)}
.res{display:grid;gap:14px;justify-items:center;text-align:center;padding-top:6px}
.res h2{font:700 28px var(--f-disp)}
.res .stats{width:100%;text-align:left}
.res .list{width:100%;text-align:left}
.banner{width:100%;padding:12px;border-radius:6px;background:var(--signal);color:var(--on-signal);font:700 18px var(--f-disp);letter-spacing:.03em}
.scrim{position:fixed;inset:0;background:rgba(5,12,20,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border-radius:12px;padding:20px;max-width:360px;width:100%;display:grid;gap:12px}
.dlg h3{margin:0;font:700 22px var(--f-disp)}
.dlg p{margin:0;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;max-width:90%;text-align:center}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div id="sess" class="sess" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';

ыт из-за града."},{"id":40,"s":1,"en":"Where has the thunderstorm moved to?","ru":"Куда сместилась гроза?"},{"id":41,"s":1,"en":"Where is the thunderstorm coming from?","ru":"Откуда приближается гроза?"},{"id":42,"s":1,"en":"Lightning has struck the aircraft.","ru":"В самолет попала молния."},{"id":43,"s":1,"en":"Aerodrome is unsafe due to thick fog. You are allowed to land only at your discretion.","ru":"Аэродром небезопасен из-за густого тумана. Вам разрешается садиться только по собственному усмотрению."},{"id":44,"s":1,"en":"I have just avoided CB, now continue climbing FL 270, will advise reaching.","ru":"Я только что обошел кучево-дождевые облака, продолжаю набор до эшелона 270, занятие эшелона доложу."},{"id":45,"s":2,"en":"Read you with interference.","ru":"Слышу вас с помехами."},{"id":46,"s":2,"en":"Readability is poor. Send words twice.","ru":"Слышу вас плохо. Передавайте слова дважды."},{"id":47,"s":2,"en":"You were blocked / blotted out (covered by another station).","ru":"Вас заглушила другая станция. Вы были забиты."},{"id":48,"s":2,"en":"Say again, using another headset / Try box 2.","ru":"Повторите, используя другую гарнитуру / Попробуйте вторую радиостанцию."},{"id":49,"s":2,"en":"Negative altitude readout.","ru":"Нет данных о высоте."},{"id":50,"s":2,"en":"I have not identified you.","ru":"Я вас не идентифицировал."},{"id":51,"s":2,"en":"Your transmitter has a background noise.","ru":"От вашего передатчика идет фоновый шум."},{"id":52,"s":2,"en":"The communication is interrupted by statics.","ru":"Связь прерывается помехами. (треск и шумы в наушниках)"},{"id":53,"s":2,"en":"Squawk standby.","ru":"Установите код ответчика в режим ожидания."},{"id":54,"s":2,"en":"Do you have a transponder on board? Are you squawking?","ru":"На борту есть ответчик? Вы используете ответчик?"},{"id":55,"s":2,"en":"Mode \"C\" wrong indication.","ru":"Неправильный ответ по высоте."},{"id":56,"s":2,"en":"I am lost (unsure of my position), request my position.","ru":"Потеря ориентировки (не уверен в своем местоположении), прошу текущее местоположение."},{"id":57,"s":2,"en":"I read you fits and starts (now and then).","ru":"Слышу вас временами (с перебоями)."},{"id":58,"s":2,"en":"Shall I transmit in full or in part?","ru":"Передавать полностью или частично?"},{"id":59,"s":2,"en":"Permanent interference on 123.5.","ru":"Постоянные помехи на частоте 123.5."},{"id":60,"s":2,"en":"For Tashkent actual monitor 126.8.","ru":"Для текущей метеоинформации аэропорта Ташкент прослушайте частоту 126,8."},{"id":61,"s":2,"en":"Transmitting blind due to receiver failure.","ru":"Передаю блиндом (вслепую) из-за отказа приемника."},{"id":62,"s":2,"en":"Remain this / my frequency.","ru":"Оставайтесь на этой / моей частоте."},{"id":63,"s":2,"en":"Increase the power of your transmitter.","ru":"Увеличьте мощность вашего передатчика."},{"id":64,"s":2,"en":"Squawk Mayday.","ru":"Установите код ответчика 7700."},{"id":65,"s":2,"en":"Unknown aircraft, unknown aircraft at position 41 North, 65 West, speed 348, heading of 132, Squawk ident","ru":"Неопознанное воздушное судно, неопознанное воздушное судно на позиции 41° северной широты, 65° западной долготы, скорость 348, курс 132, ответчик в режиме Ident."},{"id":66,"s":3,"en":"Broken vehicle on the TWY.","ru":"На рулежной дорожке неисправное транспортное средство."},{"id":67,"s":3,"en":"You have gone too far. You missed TWY D4. Wait there for the follow-me car.","ru":"Вы заехали слишком далеко. Вы пропустили рулежную дорожку D4. Ожидайте на месте машину сопровождения."},{"id":68,"s":3,"en":"Turn in the holding bay, take the first convenient left turn onto TWY Juliet.","ru":"Развернитесь в кармане ВПП, поверните налево на первую удобную рулежную дорожку Джульет."},{"id":69,"s":3,"en":"Stop taxi, a Boeing 737 has taken a wrong turning and is blocking the TWY.","ru":"Остановите руление, Боинг 737 ошибся поворотом и заблокировал рулежную дорожку."},{"id":70,"s":3,"en":"You'll have to wait until a tug pushes him bac "Разрешен заход по ИЛС на ВПП 09 левая. Боковой маневр на ВПП 09 правая."},{"id":112,"s":4,"en":"We left chocks on RWY 02R. Send someone to pick them up.","ru":"Мы оставили колодки на ВПП 02П. Пошлите кого-нибудь забрать их."},{"id":113,"s":4,"en":"Dim approach lights to 50 per cent.","ru":"Уменьшите яркость посадочных огней до 50 процентов."},{"id":114,"s":4,"en":"Your time of departure expires at 12:30.","ru":"Ваше время отбытия истекает в 12:30."},{"id":115,"s":4,"en":"Take off denied / clearance void (USA) if not airborne at 17.","ru":"Взлет запрещается, если не взлетите в 17 минут."},{"id":116,"s":4,"en":"Why have you delayed our departure?","ru":"Почему вы задержали наш вылет?"},{"id":117,"s":4,"en":"What is the usable length of RWY 27?","ru":"Какова доступная длина ВПП 27?"},{"id":118,"s":4,"en":"Request returning to stand, unable to start-up engine.","ru":"Запрашиваем возвращение на стоянку, не можем запустить двигатель."},{"id":119,"s":4,"en":"Permission for your flight is not granted.","ru":"Разрешение на ваш полет не выдано."},{"id":120,"s":4,"en":"There is a 55 min delay due to computer failure. Your slot time is 09.45.","ru":"Задержка на 55 минут из-за сбоя компьютера. Ваш слот на 09:45."},{"id":121,"s":4,"en":"Request departure RWY 08L intersection M.","ru":"Прошу взлет с перекрестка М ВПП 08 левая."},{"id":122,"s":4,"en":"Take off aborted due to tyre blow out. We slid slightly off the RWY 10.","ru":"Взлет прерван из-за лопнувшей шины. Мы немного съехали с ВПП."},{"id":123,"s":4,"en":"Stopping, take off abandoned due to engine failure.","ru":"Останавливаемся, взлет прерван из-за отказа двигателя."},{"id":124,"s":4,"en":"Why did you reject take-off?","ru":"Почему вы прервали взлет?"},{"id":125,"s":4,"en":"We seem to have a nose gear tyre blow out on landing. Request a tug to tow us to the apron.","ru":"Кажется, на посадке лопнула покрышка на носовой стойке шасси. Запрашиваем тягач для буксировки на перрон."},{"id":126,"s":4,"en":"We aquaplaned after touchdown and have at least 2 tyres blown out on right main gear.","ru":"После касания произошло гидроглиссирование, и на правой основной стойке шасси лопнули как минимум 2 покрышки."},{"id":127,"s":4,"en":"Large flock of birds (bird congestion) observed crossing left to right at the upwind end of RWY 24.","ru":"При взлете с ВПП 24 на начальном этапе набора наблюдалась большая стая птиц, пересекавшая слева направо."},{"id":128,"s":5,"en":"Report your position over AMDAR, which is mandatory (CRP- compulsory reporting point).","ru":"Доложите ваше место над точкой AMDAR, которая является точкой обязательного донесения."},{"id":129,"s":5,"en":"Offset track 2 miles left is approved.","ru":"Разрешено следовать 2 мили параллельно заданному маршруту."},{"id":130,"s":5,"en":"Verify your assigned altitude (pilots should check and confirm assigned altitude).","ru":"Проверьте и подтвердите вашу заданную высоту."},{"id":131,"s":5,"en":"Unable clearance into RVSM airspace, maintain (or descend to, or climb to) FL...","ru":"Нет разрешения на вход в воздушное пространство RVSM, сохраняйте (или снижайтесь, или поднимайтесь до) эшелона…"},{"id":132,"s":5,"en":"For the time being maintain (remain) FL ............","ru":"Пока оставайтесь на этом эшелоне."},{"id":133,"s":5,"en":"Level off (at) FL 150.","ru":"Перейдите в горизонтальный полет на эшелоне 150."},{"id":134,"s":5,"en":"You are released on frequency.............","ru":"Вы переводитесь на частоту............."},{"id":135,"s":5,"en":"Maintain FL 370 proceed to OGODA, hold north-west, inbound radial 288, all turns right, legs at your discretion.","ru":"Сохраняйте эшелон 370, следуйте в точку OGODA, ждите северо-западнее, на радиале 288, все развороты правые, длина участков на ваше усмотрение."},{"id":136,"s":5,"en":"Expect radar vector across the final approach course, fly heading 340 for spacing.","ru":"Ожидайте векторение с пересечением посадочного курса, выдерживайте курс 340 для создания интервала."},{"id":137,"s":5,"en":"You have crossed the final approach course. Turn right immediately heading 240 to join the localizer.","ru":"Вы пересекли посадочный курс. Разворачивайтесь вправо на курс 240 немедленно, чтобы захватить курсовой луч ИЛС."},{"id":138,"s":5,"en":"Will it suit you to align 5 NM? (Arrival procedure)","ru":"Устроит ли вас спрямление на 5 морских миль?"},{"id":139,"s":5,"en":"Can you slope down?","ru":"Можете ли вы ускорить снижение?"},{"id":140,"s":5,"en":"Do not exceed speed 250 knots (not greater/or less).","ru":"Не превышайте скорость 250 узлов (не больше/или меньше)."},{"id":141,"s":5,"en":"Make a right-hand orbit for spacing / orbit right for spacing.","ru":"Выполните правую орбиту для создания интервала."},{"id":142,"s":5,"en":"Turn right 90° for identification.","ru":"Поверните направо на 90° для опознования."},{"id":143,"s":5,"en":"Maintain present heading until FIR boundary.","ru":"Сохраняйте текущий курс до границы РПИ."},{"id":144,"s":5,"en":"Reduce to approach (circuit) speed.","ru":"Уменьшите скорость до посадочной (или схемной)."},{"id":145,"s":5,"en":"Continue / fly RWY heading for 4 min.","ru":"Продолжайте/летите по курсу ВПП в течение 4 минут."},{"id":146,"s":5,"en":"Resume own navigation.","ru":"Возвращайтесь к самостоятельной навигации."},{"id":147,"s":5,"en":"Request 10° heading change to avoid build-up.","ru":"Запрашиваем изменение курса на 10°, чтобы обойти грозовое образование."},{"id":148,"s":5,"en":"Could we have slightly lower level? We are experiencing moderate turbulence at FL 340.","ru":"Можно нам занять эшелон ниже? На эшелоне 340 умеренная турбулентность."},{"id":149,"s":5,"en":"We have just passed through some severe turbulence. What kind of traffic is there ahead of us?","ru":"Мы только что прошли через сильную турбулентность. Какой самолет впереди нас?"},{"id":150,"s":5,"en":"It must have been wake turbulence, there is a 747 ahead, although normal separation was provided.","ru":"Это, должно быть, спутный след. Впереди Боинг 747, хотя установленный интервал был соблюден."},{"id":151,"s":5,"en":"VOR approach is not available due to equipment failure.","ru":"Заход по VOR недоступен из-за отказа оборудования."},{"id":152,"s":5,"en":"Continue visually or go around.","ru":"Продолжайте визуально или уходите на второй круг."},{"id":153,"s":5,"en":"Advisory to all concerned.","ru":"Сообщение всем, кого касается."},{"id":154,"s":5,"en":"Report RWY in sight (ground contact).","ru":"Доложите, как увидите ВПП (или контакт с землей)."},{"id":155,"s":5,"en":"Keep the plane ahead of you in sight.","ru":"Удерживайте самолет перед вами в поле зрения."},{"id":156,"s":5,"en":"Glide slope below 300 m is unreliable. You have to make a visual approach RWY 16.","ru":"Глиссада ниже 300 м ненадежна. Вам необходимо выполнить визуальный заход на ВПП 16."},{"id":157,"s":5,"en":"Confirm your heading and continue further descent to FL 190.","ru":"Подтвердите курс и продолжайте снижение до эшелона 190."},{"id":158,"s":5,"en":"FL 330 is unavailable.","ru":"Эшелон 330 недоступен."},{"id":159,"s":5,"en":"Is FL 300 acceptable for you?","ru":"Подходит ли вам эшелон 300?"},{"id":160,"s":5,"en":"Remain outside the controlled airspace. Expect clearance at 35.","ru":"Оставайтесь вне контролируемого пространства. Ожидайте разрешение в 35 минут."},{"id":161,"s":5,"en":"Turn left heading 160°. It will take you to LT, 25 miles to run.","ru":"Развернитесь влево, курс 160°. Это выведет вас на точку LT, удаление 25 миль."},{"id":162,"s":5,"en":"Leveling FL 150.","ru":"Сохраняю эшелон 150."},{"id":163,"s":5,"en":"Do not stray away.","ru":"Не отклоняйтесь от трассы."},{"id":164,"s":5,"en":"FL 330 is not available due to restrictions. Alternatives are FL 350 and FL 310. Advise your decision.","ru":"Эшелон 330 недоступен из-за ограничений. Доступны эшелоны 350 и 310. Сообщите ваше решение."},{"id":165,"s":5,"en":"Overfly the hazardous area at flight level 390 not lower.","ru":"Перелетайте опасную зону на эшелоне 390, не ниже."},{"id":166,"s":5,"en":"Request level change due to severe turbulence (icing).","ru":"Запрашиваем смену эшелона из-за сильной турбулентности (обледенения)."},{"id":167,"s":5,"en":"Request level change due to clear air turbulence.","ru":"Запрашиваем смену эшелона из-за турбулентности в ясном небе."},{"id":168,"s":5,"en":"There is severe turbulence at FL 300. Request FL 250 instead of 300.","ru":"На эшелоне FL 300 сильная турбулентность. Запрашиваем FL 250 вместо FL 300."},{"id":169,"s":5,"en":"Request a left turn out.","ru":"Запрашиваем левый разворот после взлета."},{"id":170,"s":5,"en":"Are there any restrictions on our heading?","ru":"Есть ли ограничения на наш курс?"},{"id":171,"s":5,"en":"What is the lowest safe level?","ru":"Каков минимальный безопасный эшелон?"},{"id":172,"s":5,"en":"Cleared to avoid weather only within the route (гроза).","ru":"Разрешается обходить грозу только в пределах маршрута."},{"id":173,"s":5,"en":"What heading must I set to come back on track?","ru":"Какой курс мне установить, чтобы вернуться на маршрут?"},{"id":174,"s":5,"en":"Penetrating top of clouds.","ru":"Входим в верхнюю кромку облачности."},{"id":175,"s":5,"en":"Coordinate transfer of control with ATC units.","ru":"Согласуйте передачу управления с подразделениями УВД."},{"id":176,"s":5,"en":"For your information, drone (UAV - Unmanned Aerial Vehicle) in the vicinity of SR, radius 10 km, height 350 m from 4:00 till 15:00.","ru":"Для информации: в районе SR дрон (БПЛА), радиус 10 км, высота 350 м, с 4:00 до 15:00."},{"id":177,"s":5,"en":"For your information, paragliding in the vicinity of Yusufxona/Beldersay, height 30 m from 4:00 till 15:00.","ru":"Для информации: в районе Yusufxona/Beldersay проходят полеты на парапланах, высота 30 м, с 4:00 до 15:00."},{"id":178,"s":5,"en":"For your information. Light firing available.","ru":"Для вашей информации, возможна стрельба из легкого вида оружия."},{"id":179,"s":5,"en":"Why are you losing altitude so rapidly?","ru":"Почему вы теряете высоту так стремительно?"},{"id":180,"s":5,"en":"Why didn’t you report passing MIRZO?","ru":"Почему не доложили прохождение MIRZO?"},{"id":181,"s":5,"en":"Spell position where we shall proceed to.","ru":"Назовите по буквам точку (пункт), куда мы должны следовать."},{"id":182,"s":6,"en":"Traffic crossing left to right at FL 300.","ru":"Борт пересекает слева направо на эшелоне 300."},{"id":183,"s":6,"en":"Traffic same direction 32 miles behind you, moving faster. FL 120.","ru":"Попутный борт на 32 мили позади вас, движется быстрее. Эшелон 120."},{"id":184,"s":6,"en":"Longitudinal separation will be 16 miles.","ru":"Продольное эшелонирование составит 16 миль."},{"id":185,"s":6,"en":"Lateral separation will be 11 miles.","ru":"Боковое эшелонирование составит 11 миль."},{"id":186,"s":6,"en":"Traffic will be climbing through your level, distance 20 miles.","ru":"Борт будет набирать высоту через ваш эшелон, расстояние 20 миль."},{"id":187,"s":6,"en":"Traffic 12 o'clock.","ru":"Борт прямо по курсу (12 часов)."},{"id":188,"s":6,"en":"Traffic 6 o'clock.","ru":"Борт сзади (6 часов)."},{"id":189,"s":6,"en":"Traffic 10 o’clock crossing left to right, height unknown. If not in sight/ negative contact turn left heading 270.","ru":"Борт на 30 градусов слева пересекает слева направо, высота неизвестна. В случае если борт не наблюдаете, поверните влево курсом 270."},{"id":190,"s":6,"en":"Unknown traffic, opposite direction 11 o'clock, 9 miles FL 150.","ru":"Неизвестное воздушное движение, встречное направление, на 11 часов, расстояние 9 миль, эшелон 150."},{"id":191,"s":6,"en":"Lose time to arrive at 50.","ru":"Затяните время, чтобы прибыть в точку в 50 минут."},{"id":192,"s":6,"en":"Avoiding action: a left turn of 30 degrees will take you well clear.","ru":"Маневр расхождения: левый разворот на 30 градусов обеспечит расхождение."},{"id":193,"s":6,"en":"Reduce speed for the benefit of preceding aircraft.","ru":"Уменьшите скорость для создания благоприятных условий следующему впереди самолету."},{"id":194,"s":6,"en":"Reduced separation. Cleared to land after the preceding aircraft.","ru":"Сокращенный интервал. Разрешена посадка за предыдущим самолетом."},{"id":195,"s":6,"en":"Where are we identified?","ru":"Где мы идентифицированы?"},{"id":196,"s":6,"en":"Are there any restrictions on our heading?","ru":"Есть ли ограничения на наш курс?"},{"id":197,"s":6,"en":"We have just had to dive to avoid colliding with converging traffic. It was a very close thing. I'll check if the passengers are OK.","ru":"Мы только что были вынуждены уйти в снижение (поднырнуть), чтобы избежать столкновения с сближающимся бортом. Это было очень близко. Проверю состояние пассажиров."},{"id":198,"s":6,"en":"Unable to comply, TCAS resolution advisory.","ru":"Не можем выполнить, рекомендации TCAS по разрешению угрозы столкновения."},{"id":199,"s":6,"en":"TCAS RA (resolution advisory). Clear of traffic. Request climb to FL 150.","ru":"Набрал высоту по TCAS (или снизился), с бортом разошлись. Прошу вернуться на эшелон 150."},{"id":200,"s":6,"en":"TCAS RA. Returning to FL 150.","ru":"Сработал TCAS RA. Возвращаюсь на эшелон 150."},{"id":201,"s":6,"en":"Now clear of traffic. Resume own navigation.","ru":"С бортом разошлись. Возвращайтесь к самостоятельной навигации."},{"id":202,"s":6,"en":"Maintain 10 min separation from Airbus 320.","ru":"Сохраняйте 10 минутный интервал от Airbus 320."},{"id":203,"s":6,"en":"We had a near miss with a low-flying fighter.","ru":"У нас было опасное сближение с истребителем, летящим на малой высоте."},{"id":204,"s":6,"en":"We have had a dangerous near miss with converging traffic. The safety separation has not been provided. We intend to file an air miss report.","ru":"Произошло опасное сближение с другим бортом. Безопасный интервал не был обеспечен. Планируем подать донесение об опасном сближении."},{"id":205,"s":6,"en":"We were forced to dive to avoid colliding with converging traffic.","ru":"Мы были вынуждены уйти в резкое снижение, чтобы избежать столкновения с встречным бортом."},{"id":206,"s":6,"en":"An aircraft has just overtaken us. There was no necessary separation.","ru":"Борт только что обогнал нас. Не было необходимого интервала."},{"id":207,"s":6,"en":"Could you see identification and type of near-missing aircraft?","ru":"Увидели ли вы идентификацию и тип сближающегося борта?"},{"id":208,"s":7,"en":"I'll keep you advised.","ru":"Я буду держать вас в курсе."},{"id":209,"s":7,"en":"You are steady on the glide path.","ru":"Вы стабилизировались на глиссаде."},{"id":210,"s":7,"en":"Samarkand cannot be used as alternate.","ru":"Самарканд не может использоваться в качестве запасного аэродрома."},{"id":211,"s":7,"en":"Why are we directed to alternate?","ru":"Почему нас направляют на запасной?"},{"id":212,"s":7,"en":"Do you expect any difficulties on landing?","ru":"Ожидаете ли вы какие-либо трудности при посадке?"},{"id":213,"s":7,"en":"Are you familiar with NDB/ILS/VOR DME approach to RWY 08L?","ru":"Вы знакомы с заходом на посадку на ВПП 08L по NDB/ILS/VOR DME?"},{"id":214,"s":7,"en":"In case of going around, climb on RWY heading to altitude 1300 ft.","ru":"В случае ухода на второй круг выполняйте набор по курсу ВПП до высоты 1300 футов."},{"id":215,"s":7,"en":"Cleared low pass, minimum descent height 165 ft, after passing Tower climb on RWY heading 4000 ft, at 660 ft change to RADAR 119.4.","ru":"Разрешен низкий пролет, минимальная высота снижения 165 футов, после пролета вышки наберите высоту по курсу ВПП 4000 футов, на 660 футах работайте с Подходом на 119.4."},{"id":216,"s":7,"en":"You are landing on the wrong RWY.","ru":"Вы заходите на неправильную ВПП."},{"id":217,"s":7,"en":"Circle to land.","ru":"Заход с круга."},{"id":218,"s":7,"en":"VOR approach is not available due to equipment failure.","ru":"Заход по VOR недоступен из-за отказа оборудования."},{"id":219,"s":7,"en":"Report RWY in sight (ground contact).","ru":"Доложите, как увидите ВПП (визуальный контакт с землей)."},{"id":220,"s":7,"en":"Glide slope below 300 m is unreliable. You have to make a visual approach RWY 16.","ru":"Глиссада ниже 300 м ненадежна. Вам необходимо выполнить визуальный заход на ВПП 16."},{"id":221,"s":7,"en":"Request touch and go.","ru":"Запрашиваем посадку с последующим взлетом."},{"id":222,"s":7,"en":"When shall we expect approach clearance?","ru":"Когда нам ожидать разрешение на заход?"},{"id":223,"s":7,"en":"Request RWY condition","ru":"Каково состояние ВПП?"},{"id":224,"s":7,"en":"Established on ILS, RWY 08L in sight.","ru":"На курсовом маяке, ВПП 08L в поле зрения."},{"id":225,"s":7,"en":"At what altitude do we have to intercept the glide slope?","ru":"На какой высоте мы должны войти в глиссаду?"},{"id":226,"s":7,"en":"Unable to land due to high approach.","ru":"Не можем посадить самолет из-за высокого захода."},{"id":227,"s":7,"en":"Belly landing (Wheels-up landing; Landing with retracted wheels).","ru":"Посадка \"на брюхо\" (с убранными шасси)."},{"id":228,"s":7,"en":"Show (use, switch on, turn up) the approach lights on 100 per cent.","ru":"Установите яркость посадочных огней на 100 процентов."},{"id":229,"s":7,"en":"Go around, I say again go around, the weather is below minima.","ru":"Уходите на второй круг, повторяю, уходите на второй круг, погода ниже минимума."},{"id":230,"s":7,"en":"Report the reason for going around.","ru":"Сообщите причину ухода на второй круг."},{"id":231,"s":7,"en":"Make a missed approach procedure.","ru":"Выполните процедуру ухода на второй круг."},{"id":232,"s":7,"en":"You will not hit RWY 18 from your present position.","ru":"Вы не попадете на ВПП 18 с вашего текущего положения."},{"id":233,"s":7,"en":"ILS localizer is inoperative due (to) maintenance work.","ru":"Система ИЛС не работает из-за ремонтных работ."},{"id":234,"s":7,"en":"Reduce your speed to avoid holding.","ru":"Уменьшите скорость, чтобы избежать зоны ожидания."},{"id":235,"s":7,"en":"Due to traffic congestion make one right hand orbit in your present position and leave on heading 180.","ru":"Из-за большого скопления бортов выполните вираж вправо с вашего текущего местоположения и покиньте курсом 180."},{"id":236,"s":7,"en":"Blink your landing lights.","ru":"Помигайте вашими посадочными огнями."},{"id":237,"s":8,"en":"Your aircraft engine is trailing smoke.","ru":"От двигателя вашего самолета идет дым."},{"id":238,"s":8,"en":"Execute instructions immediately upon receipt.","ru":"Выполняйте указания сразу после получения."},{"id":239,"s":8,"en":"Left engine is on fire. Request radar vectors for backcourse landing.","ru":"Левый двигатель в огне. Прошу векторение на обратный заход."},{"id":240,"s":8,"en":"Your company has informed us you may have a bomb on board.","ru":"Ваша авиакомпания сообщила нам, что у вас на борту может быть бомба."},{"id":241,"s":8,"en":"Unable RVSM due equipment.","ru":"Выдерживать RVSM не могу из-за неисправности оборудования."},{"id":242,"s":8,"en":"Negative RVSM state aircraft.","ru":"Самолет государственного воздушного судна без допуска к RVSM."},{"id":243,"s":8,"en":"Left engine is losing power.","ru":"Левый двигатель теряет мощность."},{"id":244,"s":8,"en":"Smoke of unknown origin in passengers' compartment.","ru":"Дым неизвестного происхождения в пассажирском салоне."},{"id":245,"s":8,"en":"We are low on fuel (short of fuel). Is it possible to make a straight-in approach?","ru":"У нас мало топлива. Возможен ли прямой заход на посадку?"},{"id":246,"s":8,"en":"We have engine failure, have to make forced landing. Where shall we dump fuel?","ru":"У нас отказ двигателя, вынуждены совершить аварийную посадку. Где можно слить топливо?"},{"id":247,"s":8,"en":"We have severe fuel leak, have to return to base.","ru":"У нас сильная утечка топлива, вынуждены вернуться на базу."},{"id":248,"s":8,"en":"Mayday, Mayday, Mayday, Tashkent Tower, UZB 120 have intercepted Mayday from Lufthansa 8390, engine failure forced landing at your aerodrome. 8 miles west of TKT VOR FL 250 descending heading 120.","ru":"Мэйдэй, Мэйдэй, Мэйдэй, Ташкент Вышка, UZB 120 :"Меня перехватил военный самолет."},{"id":273,"s":8,"en":"We have to coordinate it with Tashkent.","ru":"Мы должны согласовать это с Ташкентом."},{"id":274,"s":8,"en":"Seems the cargo shifted.","ru":"Предполагаю, что груз сместился."},{"id":275,"s":8,"en":"Report souls (total number) on board.","ru":"Доложите общее количество человек на борту."},{"id":276,"s":9,"en":"How many persons are injured?","ru":"Сколько человек пострадало?"},{"id":277,"s":9,"en":"As a result of evasive action, some passengers have been injured (hurt, bruised). Request priority for landing and medical assistance upon arrival.","ru":"В результате маневра уклонения некоторые пассажиры пострадали (ушибы, травмы). Просим приоритетную посадку и медицинскую помощь по прибытии."},{"id":278,"s":9,"en":"We have a passenger with an acute pain/bleeding/food poisoning/asthma attack/stomach ache/breath difficulties/choked with.../unconscious/diabetic. Advise Gatwick we need medical service (a surgeon, a cardiologist) after landing.","ru":"На борту пассажир с острой болью/кровотечением/пищевым отравлением/приступом астмы/болями в животе/затрудненным дыханием/подавился/без сознания/диабетик. Сообщите в Гатвик, что нам нужна медицинская помощь (хирург, кардиолог) после посадки."},{"id":279,"s":9,"en":"We have an offending (unruly/aggressive/intoxicated) passenger on board. He refuses to fulfill the requirements of the crew members. Request police for disembarkation of the offending passenger from the aircraft upon landing at your airport.","ru":"На борту пассажир с агрессивным поведением, отказывающийся выполнять требования экипажа. Просим полицию для снятия пассажира-нарушителя с самолета по прибытии."},{"id":280,"s":9,"en":"One passenger has serious stomachache. We need an ambulance upon arrival.","ru":"У одного пассажира сильная боль в животе. Нам нужна скорая помощь по прибытии."},{"id":281,"s":9,"en":"A baby delivery has started on board.","ru":"На борту начались роды."},{"id":282,"s":9,"en":"We have a sick/disabled person on board. We need a stretcher/ambulift/wheelchair upon arrival.","ru":"У нас больной/человек с ограниченными возможностями на борту. Нам нужны носилки/подъемник/инвалидное кресло по прибытии."},{"id":283,"s":9,"en":"We have some wounded people on board.","ru":"У нас раненые на борту."},{"id":284,"s":9,"en":"What do terrorists demand? (What are the demands of the terrorists?)","ru":"Какие требования у террористов?"},{"id":285,"s":9,"en":"The terrorists demand drugs and currency.","ru":"Террористы требуют наркотики и валюту."},{"id":286,"s":9,"en":"The passengers are captured as hostages.","ru":"Пассажиры захвачены как заложники."},{"id":287,"s":9,"en":"Six passengers have been badly bruised, but there's a doctor on board, we'll continue on our route.","ru":"Шесть пассажиров получили серьезные ушибы, но на борту есть врач. Мы продолжим маршрут."},{"id":288,"s":9,"en":"Terrorists demand food, blankets, and charts.","ru":"Террористы требуют еду, одеяла и карты."},{"id":289,"s":9,"en":"Nobody was hurt, everybody is well.","ru":"Никто не пострадал, все в порядке."},{"id":290,"s":9,"en":"After landing terrorists intend to let women and children go.","ru":"После посадки террористы намерены отпустить женщин и детей."},{"id":291,"s":9,"en":"Your message will be recorded and sent to appropriate authority.","ru":"Ваше сообщение будет записано и отправлено в соответствующий орган."},{"id":292,"s":9,"en":"What door will the VIP get off?","ru":"Через какую дверь выйдет ВИП пассажир?"},{"id":293,"s":10,"en":"Unable to land due to flaps failure.","ru":"Не могу выполнить посадку из-за отказа закрылков."},{"id":294,"s":10,"en":"Unable to extend flaps (beyond 10 degrees). Request high speed approach to RWY 26, which is the longest available.","ru":"Не могу выпустить закрылки (более чем на 10 градусов). Прошу высокоскоростной заход к ВПП 26, которая является самой длинной."},{"id":295,"s":10,"en":"It might be indication failure. Will check it out.","ru":"Предполагаю отказ системы индикации. Буду проверять."},{"id":296,"s":10,"en":"Captain’s windscreen cracked due to bird strike.","ru":"Переднее стекло кабины экипажа дало трещину из-за удара птицы."},{"id":297,"s":10,"en":"We have structural damage due to explosion, extent unknown.","ru":"У нас повреждение конструкции из-за взрыва, степень неизвестна."},{"id":298,"s":10,"en":"Abnormal (unsafe) gear indications, request to observe wheels from the ground.","ru":"Ненормальная (небезопасная) индикация шасси, прошу посмотреть с земли."},{"id":299,"s":10,"en":"We deviated from the route due to navigation system failure.","ru":"Мы отклонились от маршрута из-за отказа навигационной системы."},{"id":300,"s":10,"en":"Fuel exhaustion.","ru":"Имею повышенный расход топлива."},{"id":301,"s":10,"en":"Pressure is low in fuel feed system.","ru":"Низкое давление в топливной системе."},{"id":302,"s":10,"en":"Secondary power supply is not available.","ru":"Резервный источник питания отсутствует."},{"id":303,"s":10,"en":"Engine damage due to a foreign object.","ru":"Повреждение двигателя из-за попадания постороннего предмета."},{"id":304,"s":10,"en":"Captain’s altimeter erratic, need replacement.","ru":"Высотомер командира работает неустойчиво, нуждаемся в замене."},{"id":305,"s":10,"en":"Unable to land now due to excessive weight. I intend to jettison fuel. Where can I dump fuel?","ru":"Я не могу произвести посадку сейчас из-за избыточного веса. Я намереваюсь слить горючее. Где я могу это сделать?"},{"id":306,"s":10,"en":"Speed indicator is out of order.","ru":"Индикатор скорости вышел из строя."},{"id":307,"s":10,"en":"Improper landing flare.","ru":"Неправильный выравнивающий маневр при посадке."},{"id":308,"s":10,"en":"The engine is running again, disregard the urgency message.","ru":"Двигатель снова работает, просьба отменить сообщение об экстренной ситуации."},{"id":309,"s":10,"en":"We have shut down one engine due to bird ingestion. Request descent and landing data.","ru":"Один двигатель выключен из-за попадания птицы. Запрашиваем снижение и данные для посадки."},{"id":310,"s":10,"en":"Our left main gear is jammed. Request vectors to holding area in order to complete check.","ru":"Застряла левая основная стойка шасси. Запрашиваем векторение в зону ожидания для проверки."},{"id":311,"s":10,"en":"Engine №1 has oil exhaustion.","ru":"Повышенный расход масла двигателя №1."},{"id":312,"s":10,"en":"Wind screen wipers are out of control / inoperative / failed.","ru":"Не работают стеклоочистители."},{"id":313,"s":10,"en":"We have an engine failure. We intend to return to base, but we have to dump / burn 40 tons of fuel first.","ru":"Отказ двигателя. Планируем возвращение на базу, но сначала нужно слить/выработать 40 тонн топлива."},{"id":314,"s":10,"en":"Unable to maintain my altitude on two engines due to overheating.","ru":"Не можем удерживать высоту на двух двигателях из-за перегрева."},{"id":315,"s":10,"en":"Unable to maintain FL 380 due (to) heavy. Request lower level.","ru":"Не могу выдерживать эшелон 380 из-за веса. Просим эшелон ниже."},{"id":316,"s":10,"en":"After take-off we lost speed and height.","ru":"После взлета мы потеряли скорость и высоту."},{"id":317,"s":10,"en":"We have severe engine damage.","ru":"У нас серьезные повреждения двигателя."},{"id":318,"s":10,"en":"Fuel consumption system failure.","ru":"Отказ системы расхода топлива."},{"id":319,"s":10,"en":"We have fuel pump failure.","ru":"Отказ топливного насоса."},{"id":320,"s":10,"en":"Right engine is cut off.","ru":"Правый двигатель выключен."},{"id":321,"s":10,"en":"Engine No.1 oil temperature is excessively high.","ru":"Температура масла в двигателе №1 слишком высокая."},{"id":322,"s":10,"en":"Engine is restarted/relit (is running again).","ru":"Двигатель перезапущен (работает снова)."},{"id":323,"s":10,"en":"I have sunk / got bogged down, will you send a tractor to pull us away?","ru":"Я застрял, пришлите тягач, чтобы вытащить нас."},{"id":324,"s":10,"en":"The right gear bogged down. Request passenger steps and busses to take passengers to terminal.","ru":"Правая стояка шасси застряла. Запрашиваю трапы и автобусы, чтобы отвезти пассажиров в аэровокзал."},{"id":325,"s":10,"en":"Idle reverse thrust.","ru":"Реверсивная тяга на холостом ходу."},{"id":326,"s":10,"en":"No.1 engine change is required upon arrival.","ru":"Необходима замена двигателя №1 по прибытии."},{"id":327,"s":10,"en":"I am low on fuel (I am short of fuel; I have a fuel shortage).","ru":"У меня мало топлива."},{"id":328,"s":10,"en":"We have to make off-field landing.","ru":"Мы вынуждены совершить посадку вне аэродрома."},{"id":329,"s":10,"en":"Suspecting fire in rear baggage compartment. Warning light is on.","ru":"Подозреваем пожар в заднем багажном отделении. Загорелась индикация пожара."},{"id":330,"s":10,"en":"We have a problem with air-cooling system, hot air from engine is getting inside the passenger compartment.","ru":"У нас проблема с системой охлаждения. Горячий воздух из двигателя поступает в пассажирский салон."},{"id":331,"s":10,"en":"You will have to burn out fuel (to jettison, to dump fuel) 5 miles north of the field.","ru":"Вам придется выработать топливо (или сбросить его) в 5 милях к северу от аэродрома."},{"id":332,"s":10,"en":"Engine No.2 shut down due to oil leak.","ru":"Мы выключили двигатель номер 2 из-за утечки масла."},{"id":333,"s":10,"en":"Landing gear down but may not be locked. We intend to make a low pass near the Tower to have the undercarriage checked.","ru":"Шасси выпущены, но возможно не зафиксированы. Планируем малый проход рядом с вышкой для проверки шасси."},{"id":334,"s":10,"en":"Request low pass, we suspect undercarriage problem. Have a look from the ground.","ru":"Запрашиваем малый проход, подозреваем неисправность шасси. Посмотрите с земли."},{"id":335,"s":10,"en":"Your landing gear seems to be completely extended/ entirely missing.","ru":"Ваше шасси кажется полностью выпущено/ полностью отсутствует."},{"id":336,"s":10,"en":"We need water for wheels cooling.","ru":"Нам необходима вода для охлаждения колес"},{"id":337,"s":10,"en":"All operations are normal now.","ru":"Все работает исправно."}]};

const today=()=>fmt(new Date());

function core(en){

}

}

  const eq=(a,b)=>{if(a===b)return true;if(/\d/.test(a+b)||KEYSET.has(a)||KEYSET.has(b))return false;const L=Math.max(a.length,b.length);return L>=4&&levS(a,b)<=(L>=8?2:1)};

function pick(arr,n){
  const now=Date.now(),due=[],fresh=[],rest=[];
  for(const p of arr){const c=ST.cards[p.id];if(!c||!c.s)fresh.push(p);else if(c.due<=now)due.push(p);else rest.push(p)}
  const cb=x=>ST.cards[x.id];
  due.sort((a,b)=>cb(a).b-cb(b).b||cb(a).due-cb(b).due);
  rest.sort((a,b)=>cb(a).b-cb(b).b||cb(a).l-cb(b).l);
  const out=due.slice(0,n);
  const cap=Math.min(n-out.length,Math.max(4,Math.ceil(n*.5)));
  out.push(...(typeof S.scope==='number'?fresh:shuffle(fresh)).slice(0,cap));
  if(out.length<n)out.push(...rest.slice(0,n-out.length));
  if(out.length<n){const have=new Set(out.map(p=>p.id));out.push(...shuffle([...due,...fresh,...rest].filter(p=>!have.has(p.id))).slice(0,n-out.length))}
  return shuffle(out);
}

  const b=(ST.cards[p.id]||{b:0}).b,W=[],add=(t,w)=>W.push([t,w]);
  if(b<=1){add('mcqRE',4);add('mcqER',2);add('cloze',2);if(canBuild(p))add('build',2);if(LISTEN)add('listenEN',1)}
  else if(b<=3){if(canBuild(p))add('build',3);add('cloze',2);add('mcqRE',2);if(canType(p))add('type',2);if(LISTEN&&canBuild(p))add('listenBuild',2);add('mcqER',1)}
  else{if(canType(p))add('type',4);if(canBuild(p))add('build',2);if(LISTEN&&canBuild(p))add('listenBuild',2);add('cloze',2);add('mcqRE',1)}
  return wpick(W);
}
const simTok=p=>new Set(p.toks.map(normTok).filter(Boolean));
function distractors(p,n){

const KEYW=new Set(['left','right','climb','descend','maintain','unable','not','no','negative','cleared','reduce','increase','hold','stop','vacate','expect','report','request','confirm','verify','advise','heading','level','above','below','before','after','inbound','outbound','north','south','east','west','north-west','ahead','behind','taxi','land','takeoff','departure','approach','closed','open','higher','lower','faster','slower','immediately','continue','resume','cancel']);

function numDistractors(w){
  const out=new Set(),idx=[];w.split('').forEach((c,i)=>{if(/\d/.test(c))idx.push(i)});
  for(let k=0;k<60&&out.size<3;k++){const a=w.split(''),i=idx[rnd(idx.length)];a[i]=String((+a[i]+1+rnd(9))%10);const v=a.join('');if(v!==w&&(idx[0]!==0||w[0]==='0'||v[0]!=='0'))out.add(v)}
  return [...out];
}

  const lw=w.toLowerCase(),out=new Set();
  if(w===w.toUpperCase()&&w.length>=2){shuffle(CAPS).forEach(c=>{if(out.size<3&&c!==w)out.add(c)});return [...out]}
  if(OPP[lw]){let o=OPP[lw];if(w[0]===w[0].toUpperCase())o=o[0].toUpperCase()+o.slice(1);out.add(o)}
  const inP=new Set(p.toks.map(t=>t.replace(/[^A-Za-z]/g,'').toLowerCase()));
  const pool=shuffle([...SECTW[p.s]]).filter(x=>!inP.has(x)&&Math.abs(x.length-w.length)<=3&&x!==lw);
  for(const x of pool){if(out.size>=3)break;out.add(w[0]===w[0].toUpperCase()?x[0].toUpperCase()+x.slice(1):x)}

function makeCloze(p){
  const cand=[];

    const m=t.match(/^([^A-Za-z0-9]*)(.*?)([^A-Za-z0-9°]*)$/);const w=m[2];if(!w)return;
    let wt=0;if(/\d/.test(w))wt=5;else if(KEYW.has(w.toLowerCase()))wt=4;else if(w.length>=6&&i>0)wt=1;else if(w.length>=4)wt=.5;
    if(wt)cand.push([{i,pre:m[1],w,suf:m[3]},wt]);
  });
  if(!cand.length)return null;
  const c=wpick(cand);
  const d=/\d/.test(c.w)?numDistractors(c.w):wordDistractors(c.w,p);
  if(d.length<2)return null;
  return{before:p.toks.slice(0,c.i).join(' ')+(c.pre?(c.i?' ':'')+c.pre:''),after:(c.suf||'')+(c.i<p.toks.length-1?' '+p.toks.slice(c.i+1).join(' '):''),correct:c.w,opts:shuffle([c.w,...d.slice(0,3)]).map(t=>({text:t,ok:t===c.w}))};

  const p=BY.get(spec.id),t=spec.type,q={t,id:p.id};
  if(t==='mcqRE'||t==='mcqER'||t==='listenEN'||t==='listenRU'){
    const ru=(t==='mcqER'||t==='listenRU');q.ru=ru;
    q.opts=shuffle([p,...distractors(p,3)]).map(x=>({text:ru?x.ru:x.core,ok:x.id===p.id}));
  }else if(t==='build'||t==='listenBuild'){
    const items=p.toks.map((tk,i)=>({id:i,t:tk}));
    if(p.toks.length<=12){const have=new Set(p.toks.map(normTok));const extra=shuffle(P.filter(x=>x.s===p.s&&x.id!==p.id).flatMap(x=>x.toks)).filter(w=>{const n=normTok(w);return n.length>=3&&!/\d/.test(n)&&!have.has(n)});const seen=new Set();extra.forEach(w=>{const n=normTok(w);if(seen.size<2&&!seen.has(n)){seen.add(n);items.push({id:items.length,t:w})}})}
    let sh=shuffle(items);if(sh.length>2&&sh.slice(0,p.toks.length).every((x,i)=>x.id===i))sh=shuffle(items);
    q.items=sh;q.ans=[];
  }else if(t==='cloze'){
    const c=makeCloze(p);if(!c)return makeQ({id:p.id,type:'mcqRE'});Object.assign(q,c);
  }
  return q;
}
