name: Build APK

# Run it by hand: Actions tab > Build APK > Run workflow.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Copy the web app into www/
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png www/

      - name: Create the Android project
        run: npx cap add android

      - name: Allow microphone and speech recognition
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          add = ''
          if 'android.permission.RECORD_AUDIO' not in s:
              add += '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'android.speech.RecognitionService' not in s:
              add += '    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n'
          s = s.replace('</manifest>', add + '</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Sync web files and plugins into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radiocheck-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
